[package]
name = "fazuh-common"
# Do not change this in the main branch!
# On the release branches, this string will be automatically updated by CI


version = "0.1.0"


edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "Personal collection of common Rust code for my projects"
license = "MIT"
repository = "https://github.com/fazuh/fazuh-common-rs"
keywords = ["utilities", "logging", "tracing", "types"]
categories = ["development-tools", "rust-patterns"]

[features]
log = []
log-cli = ["log", "dep:clap"]
log-file = ["log", "dep:tracing-appender"]
types = []
types-serde = ["types", "dep:serde"]

[dependencies]
derive_builder = "0.20.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = { version = "0.2.3", optional = true }

clap = { version = "4.6.1", optional = true, features = ["derive"] }

serde = { version = "1.0", optional = true, features = ["derive"] }

[lints.clippy]
uninlined_format_args = "warn"
new_without_default = "allow"

[dev-dependencies]
tempfile = "3.27.0"
